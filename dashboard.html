<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Income - Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }
    header {
      background: #1877f2;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px #00000010;
    }
    button {
      background: #1877f2;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
    }
    #email {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>Work Income</h1>
    <p>কাজ করুন, দক্ষতা বাড়ান এবং আয় করুন</p>
  </header>

  <main>
    <div class="card">
      <h2>স্বাগতম!</h2>
      <p>তোমার Dashboard-এ স্বাগতম।</p>
      <p>অ্যাকাউন্ট: <span id="email">যাচাই হচ্ছে...</span></p>
    </div>

    <div class="card">
      <h3>📋 উপলব্ধ কাজ</h3>
      <p>এখনো কোনো কাজ যোগ করা হয়নি।</p>
    </div>

    <div class="card">
      <h3>💰 আমার আয়</h3>
      <p>ব্যালেন্স: ৳০.০০</p>
      <p>এটি প্রাথমিক প্রদর্শন; প্রকৃত আয়ের হিসাব নয়।</p>
    </div>

    <div class="card">
      <h3>👤 আমার অ্যাকাউন্ট</h3>
      <p>নিজের অ্যাকাউন্টের তথ্য এখানে দেখানো হবে।</p>
      <button id="logout">Logout</button>
      <p id="message"></p>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://apnjfuklpsycvgikedqv.supabase.co',
      'sb_publishable_verppfcz73vM-qRVAyacag_04EEoOaJ'
    );

    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
      window.location.replace('login.html');
    } else {
      document.getElementById('email').textContent =
        data.session.user.email || 'ব্যবহারকারী';
    }

    document.getElementById('logout').addEventListener(
      'click', async () => {
        const { error } = await supabase.auth.signOut();

        if (error) {
          document.getElementById('message').textContent =
            'Logout হয়নি। আবার চেষ্টা করো।';
          return;
        }

        window.location.replace('login.html');
      }
    );
  </script>
</body>
</html>
