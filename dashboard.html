<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#07133d">
  <meta name="description" content="FREE INCOME Dashboard">

  <title>FREE INCOME | Dashboard</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #dffcf0 0%, transparent 32%),
        radial-gradient(circle at top right, #e5e3ff 0%, transparent 35%),
        linear-gradient(135deg,#f7fffb,#f5f6ff);
      color:#182033;
      min-height:100vh;
    }

    /* TOP HEADER */
    header{
      background:
        linear-gradient(135deg,#087f5b,#1261c9 55%,#653bb7);
      color:white;
      padding:18px 5%;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 8px 30px rgba(27,53,100,.18);
    }

    .topbar{
      max-width:1200px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-logo{
      width:48px;
      height:48px;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.25);
      font-size:25px;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
    }

    .brand h1{
      font-size:22px;
      letter-spacing:.5px;
    }

    .brand span{
      display:block;
      font-size:12px;
      opacity:.82;
      margin-top:3px;
    }

    .logout-top{
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.25);
      color:white;
      padding:11px 17px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      transition:.25s;
    }

    .logout-top:hover{
      background:white;
      color:#1261c9;
      transform:translateY(-2px);
    }

    /* MAIN */
    main{
      width:min(1200px,92%);
      margin:30px auto 50px;
    }

    /* HERO */
    .hero{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      padding:35px;
      color:white;
      background:
        linear-gradient(120deg,#087f5b,#116bc7 52%,#6a3bb8);
      box-shadow:0 20px 55px rgba(35,72,130,.20);
      margin-bottom:25px;
    }

    .hero:before,
    .hero:after{
      content:"";
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,.08);
    }

    .hero:before{
      width:260px;
      height:260px;
      right:-80px;
      top:-100px;
    }

    .hero:after{
      width:180px;
      height:180px;
      right:180px;
      bottom:-110px;
    }

    .hero-content{
      position:relative;
      z-index:2;
      max-width:700px;
    }

    .hero small{
      opacity:.85;
      font-size:14px;
    }

    .hero h2{
      font-size:34px;
      margin:10px 0;
    }

    .hero p{
      line-height:1.7;
      opacity:.9;
    }

    .user-email{
      margin-top:18px;
      display:inline-block;
      padding:9px 13px;
      border-radius:12px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.20);
      overflow-wrap:anywhere;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
      margin-bottom:25px;
    }

    .stat-card{
      background:rgba(255,255,255,.82);
      border:1px solid rgba(255,255,255,.8);
      border-radius:20px;
      padding:22px;
      box-shadow:0 12px 35px rgba(42,62,100,.08);
      backdrop-filter:blur(12px);
      transition:.25s;
    }

    .stat-card:hover{
      transform:translateY(-5px);
      box-shadow:0 18px 40px rgba(42,62,100,.13);
    }

    .stat-icon{
      width:45px;
      height:45px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      font-size:22px;
      background:#edf5ff;
      margin-bottom:14px;
    }

    .stat-card h3{
      font-size:25px;
      margin-bottom:5px;
    }

    .stat-card p{
      color:#788195;
      font-size:13px;
    }

    /* GRID */
    .dashboard-grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:20px;
    }

    .card{
      background:rgba(255,255,255,.88);
      border:1px solid rgba(225,230,240,.9);
      border-radius:22px;
      padding:24px;
      box-shadow:0 12px 35px rgba(42,62,100,.07);
      margin-bottom:20px;
    }

    .card-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:20px;
    }

    .card-title h3{
      font-size:19px;
    }

    .card-title span{
      color:#7b8496;
      font-size:12px;
    }

    /* BALANCE */
    .balance{
      background:linear-gradient(135deg,#ecfff6,#eef5ff);
    }

    .balance-number{
      font-size:36px;
      font-weight:bold;
      margin:12px 0;
      background:linear-gradient(90deg,#087f5b,#1768ca,#713db7);
      -webkit-background-clip:text;
      color:transparent;
    }

    .balance-note{
      color:#7a8394;
      font-size:13px;
    }

    /* WORK */
    .work-item{
      display:flex;
      align-items:center;
      gap:15px;
      padding:16px;
      border:1px solid #edf0f5;
      border-radius:15px;
      margin-bottom:12px;
      background:#fff;
    }

    .work-icon{
      width:43px;
      height:43px;
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eef5ff;
      font-size:21px;
      flex-shrink:0;
    }

    .work-info{
      flex:1;
    }

    .work-info h4{
      margin-bottom:5px;
    }

    .work-info p{
      color:#81899a;
      font-size:12px;
    }

    .status{
      padding:6px 10px;
      border-radius:20px;
      background:#eafaf3;
      color:#078457;
      font-size:11px;
      font-weight:bold;
    }

    /* QUICK MENU */
    .menu-list{
      display:grid;
      gap:11px;
    }

    .menu-btn{
      width:100%;
      padding:14px;
      border:1px solid #edf0f5;
      background:white;
      border-radius:14px;
      text-align:left;
      cursor:pointer;
      font-size:14px;
      transition:.2s;
    }

    .menu-btn:hover{
      transform:translateX(4px);
      border-color:#cbd9ef;
      background:#f8fbff;
    }

    /* PROFILE */
    .profile{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .avatar{
      width:58px;
      height:58px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#087f5b,#1261c9,#6a3bb8);
      color:white;
      font-size:25px;
      font-weight:bold;
    }

    .profile-info{
      min-width:0;
    }

    .profile-info h4{
      margin-bottom:5px;
    }

    .profile-info p{
      color:#7d8697;
      font-size:12px;
      overflow-wrap:anywhere;
    }

    /* NOTIFICATION */
    .notification{
      display:flex;
      gap:12px;
      padding:13px 0;
      border-bottom:1px solid #edf0f5;
    }

    .notification:last-child{
      border-bottom:0;
    }

    .notification-icon{
      width:38px;
      height:38px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f1efff;
      flex-shrink:0;
    }

    .notification p{
      font-size:13px;
      line-height:1.5;
    }

    .notification small{
      color:#9aa1ae;
      font-size:10px;
    }

    /* LOGOUT */
    .logout-btn{
      width:100%;
      border:0;
      padding:14px;
      border-radius:14px;
      background:linear-gradient(135deg,#ef476f,#b83280);
      color:white;
      font-weight:bold;
      cursor:pointer;
      font-size:14px;
      transition:.25s;
    }

    .logout-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(184,50,128,.2);
    }

    #message{
      text-align:center;
      color:#d32f2f;
      font-size:12px;
      margin-top:10px;
    }

    footer{
      text-align:center;
      padding:10px 20px 30px;
      color:#8a92a2;
      font-size:12px
