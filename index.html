<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Earning - Work & Income</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f5ff;
            color: #172554;
        }

        header {
            background: white;
            padding: 15px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 2px 10px #00000010;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .brand h2 {
            color: #1457d9;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .login {
            color: #1457d9;
            border: 1px solid #1457d9;
        }

        .register {
            background: #1457d9;
            color: white;
        }

        .hero {
            text-align: center;
            padding: 90px 20px;
            min-height: calc(100vh - 150px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero img {
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 48px);
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: #1457d9;
        }

        .hero p {
            font-size: 17px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 28px;
            color: #475569;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-buttons a {
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .primary {
            background: #1457d9;
            color: white;
        }

        .secondary {
            background: white;
            color: #1457d9;
            border: 1px solid #1457d9;
        }

        footer {
            text-align: center;
            padding: 22px;
            color: #64748b;
            background: white;
        }

        @media (max-width: 480px) {
            header {
                justify-content: center;
            }

            .brand h2 {
                font-size: 21px;
            }

            .hero {
                padding: 60px 18px;
            }

            .hero img {
                width: 95px;
                height: 95px;
            }

            nav a {
                padding: 9px 14px;
            }
        }
    </style>

</head>

<body>

    <!-- Header -->
    <header>

        <div class="brand">

            <img src="logo/Logo.png"
                 alt="Free Earning Logo">

            <h2>Free Earning</h2>

        </div>

        <nav>

            <a class="login" href="login.html">
                Login
            </a>

            <a class="register" href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- Main Hero Section -->
    <main class="hero">

        <img src="logo/Logo.png"
             alt="Free Earning Logo">

        <h1>
            Welcome to <span>Free Earning</span>
        </h1>

        <p>
            আপনার কাজ, দক্ষতা ও অনলাইন আয়ের যাত্রা
            শুরু করুন Free Earning-এর সঙ্গে।
        </p>

        <div class="hero-buttons">

            <a class="primary" href="register.html">
                Get Started
            </a>

            <a class="secondary" href="login.html">
                Login to Account
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        &copy; 2026 Free Earning. All rights reserved.

    </footer>

</body>

</html>
